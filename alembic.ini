# Alembic configuration. `alembic upgrade head` runs from the repository root, like every
# other command in CLAUDE.md, and reads DATABASE_URL from the environment - see
# database/migrations/env.py for why the URL is not written here.
#
# The dependency earns its place by tracking which migrations have run and in what order:
# the two things a hand-rolled .sql runner gets wrong first (guidelines §19).

[alembic]
script_location = database/migrations

# The repository root is the import root, so env.py can import database.schema.
prepend_sys_path = .
path_separator = os

# Revision files are named `rev_<revision>_<slug>.py`. The `rev_` prefix is not decoration:
# a module whose name starts with a digit is not a valid Python module name, and
# `mypy --strict .` type-checks these files like any other.
file_template = rev_%%(rev)s_%%(slug)s
