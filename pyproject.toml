[project]
name = "competitive-research"
version = "0.1.0"
description = "Multi-Agent Competitive Research Assistant"
requires-python = ">=3.13"

# Every pin names the requirement it serves (engineering-guidelines.md §20).
# A dependency whose comment cannot name a requirement gets removed.
dependencies = [
    # Typed agent boundaries. Every agent output is a validated schema and no agent
    # parses another agent's prose (engineering-guidelines.md §3, ARCHITECTURE.md §4).
    "pydantic==2.13.4",
    # The one OpenAI-compatible client. NIM in development and the production endpoint are
    # both OpenAI-compatible, so this SDK covers both and there is no provider class
    # (ARCHITECTURE.md §20 row 4). Its own retry is switched off in llm_client.py, because
    # the backoff schedules in guidelines §17 are the only ones allowed to run.
    "openai==2.54.0",
    # Reads .env into the environment for local development. Windows has no
    # `export $(cat .env)` idiom, so without this every local command needs the whole
    # variable table set by hand. It never overrides a variable that is already set, so
    # the ECS task definition still wins in production (guidelines §16).
    "python-dotenv==1.2.2",
    # Web search that returns cleaned page content AND the URL together, which is what the
    # claim-to-source audit trail needs (guidelines §7, §9). Named in guidelines §20.
    "tavily-python==0.7.27",
    # The HTTP client behind `fetch`. Needed rather than the standard library because the
    # SSRF rule is "re-check after every redirect", which requires following redirects by
    # hand, and because MAX_FETCH_BYTES has to hold against a streaming body rather than
    # against a Content-Length header (guidelines §16, §7). Already present transitively
    # under openai; pinned here because tools/fetch.py imports it directly.
    "httpx==0.28.1",
    # PDF text extraction in `fetch`. Added on measurement, not on principle: three step-12
    # smoke jobs rejected `infosys-ar-26.pdf` and `ir-presentation.pdf` as wrong_content_type
    # - the annual report and the investor presentation, which are the best primary sources a
    # competitive-research question has. The standard library cannot parse PDF, and pypdf is
    # pure Python with no native build step, so it does not complicate the container image.
    "pypdf==6.15.0",
    # Stateful orchestration with checkpointing (CLAUDE.md stack table). Two things need it
    # rather than a hand-rolled loop: the human gate is an interrupt() that can hold a job
    # for days, and resuming from a checkpoint is what stops an approval from re-billing
    # every LLM call already spent (guidelines §4, §10). graph/build.py imports it.
    "langgraph==1.2.11",
    # The durable side, from Phase 2 (implementation steps 13-16).
    #
    # Core only - tables and statements, no ORM. Nothing here needs an identity map or lazy
    # loading, and it is what gives the five tables one definition that both PostgreSQL and
    # the offline SQLite test suite run (database/schema.py).
    "sqlalchemy==2.0.52",
    # Migrations. It earns its place by tracking which migrations have run and in what
    # order - the two things a hand-rolled .sql runner gets wrong first, and the two that
    # are painful to discover against a live database (guidelines §19).
    "alembic==1.19.1",
    # The PostgreSQL driver, and the connection pool the checkpointer holds. `psycopg[binary]`
    # rather than a source build so the container image needs no compiler.
    "psycopg[binary,pool]==3.3.4",
    # The Postgres checkpointer itself. The human gate can hold a job for days and in-memory
    # state dies with the worker, which would mean re-billing every LLM call already spent
    # (guidelines §4, §10). It owns its own tables through setup(); Alembic never touches
    # them (guidelines §19). graph/build.py imports it.
    "langgraph-checkpoint-postgres==3.1.2",
    # The API (implementation step 18). Typed request and response models on the outermost
    # boundary, which is the same treatment every internal boundary already gets - and the
    # dependency system is what keeps authentication one thing rather than a check repeated
    # in five handlers (guidelines §12, §16).
    "fastapi==0.141.1",
    # The server behind `uvicorn app:app --reload` (CLAUDE.md commands). Nothing imports it;
    # it is how the application is run, in development and in the API container.
    "uvicorn[standard]==0.52.3",
    # SQS, for the job queue (implementation step 20). It earns its place by being the only
    # client for the FIFO attributes ADR 0010 depends on - MessageGroupId, the deduplication id
    # and the redrive policy - and by working unchanged against LocalStack, which is what makes
    # the local integration tests worth running. `jobqueue.py` is the only module that imports
    # it; S3 joins the same client in a later stage, and Bedrock Runtime in `bedrock.py`
    # since ADR 0022 - which is why adding Amazon Nova as a provider added no dependency
    # at all, and why Bedrock mode needs no key: boto3 signs with the ECS task role.
    "boto3==1.43.72",
    # Cognito access-token verification (Phase 5 block B, ADR 0020). It earns its place by
    # being the one thing here that must not be hand-written: an RS256 JWT is an RSA
    # signature over a canonical string, and Python's standard library has no RSA at all, so
    # the alternatives are this or a home-made verifier on the authentication path. The
    # `crypto` extra is what pulls `cryptography`, which does the signature check itself.
    # `routes/auth.py` is the only module that imports it.
    "pyjwt[crypto]==2.13.0",
    # Short-term state, for the job queue's other half (implementation step 21). It earns its
    # place by being the only way the rate limiter can be *shared*: two workers each politely
    # limiting themselves to 40 requests per minute produce 80 (guidelines §11), and the
    # process-local alternative is a different thing wearing the same name. The caches and the
    # per-job URL set ride the same client. `redisstore.py` is the only module that imports it.
    "redis==8.1.0",
]

# Deliberately absent until something imports them:
#   A Secrets Manager client. Phase 5 block B injects secrets through the ECS task
#   definition's `secrets` block, so the ECS agent reads them and the application still
#   reads plain environment variables - no application code calls Secrets Manager, and
#   boto3 would already cover it if one ever did.
#
# langchain-core arrives transitively under langgraph and is imported directly in exactly
# one place, for the RunnableConfig type that graph/state.run_config() returns. It is not
# pinned here because nothing chooses its version: langgraph does.

[project.optional-dependencies]
dev = [
    "pytest==9.1.1", # the application test suite (CLAUDE.md commands, guidelines §18)
    "ruff==0.16.2",  # lint stage of the CI pipeline (guidelines §19)
    "mypy==2.3.0",   # type stage of the CI pipeline (guidelines §19)
    # Reads docker-compose.yml as a document rather than as text, for the Compose contract
    # tests added with the application image (step 22b/c). What they assert - that `api` and
    # `worker` resolve to the same image, that the worker publishes no port, that every
    # internal URL names a Compose service - is structure, and a regex over YAML is the kind
    # of test that passes for the wrong reason. Anchors and merge keys make that worse: the
    # shared build block is only visible after the document is parsed. Already present
    # transitively under langgraph; pinned here because tests/ imports it directly, which is
    # the same argument httpx carries above. **dev only** - no runtime module imports it.
    "pyyaml==6.0.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The repository root is the import root: `uvicorn app:app`, `python -m worker`,
# `python -m eval.run` and `python -m eval.gate` all run from here (CLAUDE.md commands).
# Listed explicitly because the layout is flat, so setuptools cannot auto-discover it.
#
# `eval` and `scripts` are deliberately absent from both lists below: they are offline
# harnesses rather than shipped application code, and `.dockerignore` keeps `eval` out of
# the image for the same reason it keeps `tests` out.
[tool.setuptools]
py-modules = [
    "app",
    "artifacts",
    "bedrock",
    "config",
    "jobqueue",
    "llm_client",
    "operations",
    "redisstore",
    "schemas",
    "worker",
]
packages = ["agents", "database", "graph", "routes", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Four markers, so a failure says which layer broke. Everything unmarked is the offline
# suite: no service, no network (guidelines §18). Each marked layer needs something Compose
# starts and skips when its own variable is unset, so `pytest` stays offline by default and
# `pytest -m <marker>` runs exactly that layer.
markers = [
    "postgres: needs the real PostgreSQL 16 from docker-compose.yml, via TEST_DATABASE_URL",
    "integration: needs LocalStack SQS from docker-compose.yml, via SQS_ENDPOINT_URL",
    "redis: needs the real Redis 7 from docker-compose.yml, via TEST_REDIS_URL",
    # The fourth is the only one that needs the application image rather than a service: it
    # drives the `app` profile's containers, so it needs `docker compose --profile app up`
    # first. Opted in with TEST_CONTAINER_STACK.
    "container: needs the built image and the `app` profile up, via TEST_CONTAINER_STACK",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# The documentation is authoritative and its Python blocks are illustrative sketches, not
# code. Formatting them rewrites the specification, so ruff stays out of *.md entirely.
extend-exclude = ["*.md", ".test-tmp"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import order
    "B", # bugbear - real bug patterns, not style
    "UP", # outdated syntax for the pinned Python
]

[tool.mypy]
python_version = "3.13"
strict = true

# tavily-python ships no py.typed marker, so mypy cannot see inside it. Silencing the
# import is the narrowest available fix: the alternative is a `# type: ignore` on every
# line that touches the SDK. tools/search.py converts its response to SearchResult
# immediately, so the untyped surface stops at that one function.
[[tool.mypy.overrides]]
module = "tavily.*"
ignore_missing_imports = true

# boto3 and botocore ship no py.typed marker either. jobqueue.py, artifacts.py and bedrock.py
# are the only modules that import them, and each converts every response into a typed value
# immediately - a JobMessage, an object key, one string of model output - so the untyped surface
# stops at those boundaries. The same argument as tavily above.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed marker and its stubs are a separate package. One test module reads
# docker-compose.yml through it, and converts the document to a typed mapping in one helper,
# so the untyped surface stops at that helper - the same argument again.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
