name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow verifies the repository; it does not publish, deploy, or request cloud access.
permissions:
  contents: read

env:
  # boto3 must never resolve a runner profile or instance metadata. LocalStack ignores these
  # placeholders, and the integration command below supplies its endpoint explicitly.
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: ap-south-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_CONFIG_FILE: /dev/null
  AWS_SHARED_CREDENTIALS_FILE: /dev/null

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy --strict .
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Run offline suite
        run: uv run pytest -q

  # The AWS infrastructure definition, checked without an AWS account (Phase 5 block A).
  #
  # **Nothing here touches AWS and nothing here needs a credential.** `init -backend=false`
  # downloads the providers and configures no state; `validate` then checks syntax, references,
  # types and required arguments entirely offline. There is deliberately **no `plan` and no
  # `apply`**: a plan reads real account state, which would make this job need credentials and
  # would make CI able to change infrastructure. Deployment is a person's decision, taken by
  # following docs/deployment.md.
  #
  # The Python contract tests in `tests/test_infrastructure_terraform.py` run in `unit` above
  # and answer a different question - not "is this valid HCL" but "does it still describe the
  # architecture we agreed", such as no NAT gateway, no public database, and a worker with no
  # ingress rule. Neither replaces the other.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # From HashiCorp's own signed apt repository rather than a pinned tarball, so the
      # signature is checked and no download URL has to be guessed at.
      - name: Install Terraform
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform
          terraform version
      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -diff
      - name: Initialise the providers without a backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra validate

  # The deterministic evaluation gate. Its own job rather than a step inside `unit`, because
  # the two answer different questions and a build log should say which one broke: `unit`
  # answers "does the code work", this answers "does the evaluation framework still hold its
  # contract". It needs no service, no Docker, no provider and no network - the twelve metrics
  # are pure functions over committed fixtures - so it is the cheapest job here.
  #
  # It gates the framework and the benchmark contract, and it gates NO metric score and NO
  # judge score. docs/evaluation.md, "What is and is not gated", is the full list.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      # No `--judge`, so no LLM client is constructed and no credential is read. The job's
      # environment carries no provider variable at all, which is what keeps normal CI
      # provider-independent (ADR 0018).
      - name: Run the deterministic DEV benchmark
        run: uv run python -m eval.run --run-id ci --csv
      # A second command reading the first one's report, deliberately: producing the evidence
      # and judging it are separate steps, so the judgement cannot quietly re-decide the
      # measurement. Exit 1 is a contract violation; exit 2 is an unusable report.
      - name: Check the evaluation regression contract
        run: uv run python -m eval.gate measurements/eval/ci.json
      # Kept whatever the outcome: the report is how a violation is diagnosed without
      # re-running anything, and it holds only committed fixture text.
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: measurements/eval/
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      # Only the service this layer actually needs. `--wait` waits on the healthcheck of
      # every service it starts, so starting the whole default stack made `pytest -m postgres`
      # depend on LocalStack's queue-and-bucket check - a dependency the suite does not have.
      - name: Start PostgreSQL 16
        run: docker compose --env-file .env.example up -d --wait postgres
      - name: Run PostgreSQL 16 suite
        env:
          TEST_DATABASE_URL: postgresql://research:research@localhost:5432/research_test
        run: uv run pytest -m postgres
      - name: Remove Compose resources
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Start Redis 7
        run: docker compose --env-file .env.example up -d --wait redis
      - name: Run Redis 7 suite
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run pytest -m redis
      - name: Remove Compose resources
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      # LocalStack only: the queue and S3 suites reach it for real, and use a temporary
      # SQLite database (tests/dbharness.py) rather than the `postgres` service.
      - name: Start LocalStack
        run: docker compose --env-file .env.example up -d --wait localstack
      - name: Run LocalStack SQS and S3 suite
        env:
          SQS_ENDPOINT_URL: http://localhost:4566
        run: uv run pytest -m integration
      # LocalStack's healthcheck waits for the queue and the bucket, so `--wait` failing
      # means the ready.d hook did not create them. The hook's own output is in the container
      # log and the failing probe's output is in the health log, and neither survives cleanup.
      - name: Diagnose LocalStack
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color localstack
          container="$(docker compose --env-file .env.example ps -aq localstack)"
          if [ -n "$container" ]; then
            docker inspect --format 'status={{ .State.Status }} exit={{ .State.ExitCode }} health={{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$container"
            docker inspect --format '{{ json .State.Health }}' "$container"
          fi
      - name: Remove Compose resources
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # RFC 2606 reserves .invalid. The container suite asserts this remains unreachable.
      LLM_BASE_URL: https://llm.invalid/v1
      LLM_MODEL: ci-model
      LLM_FAST_MODEL: ci-fast-model
      LLM_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Build the application image
        run: docker compose --env-file .env.example --profile app build
      - name: Start the application profile
        run: docker compose --env-file .env.example --profile app up -d --wait
      - name: Run container suite
        env:
          TEST_CONTAINER_STACK: "1"
        run: uv run pytest -m container
      # LocalStack's healthcheck waits for the queue and the bucket, so `--wait` failing
      # means the ready.d hook did not create them. The hook's own output is in the container
      # log and the failing probe's output is in the health log, and neither survives cleanup.
      - name: Diagnose LocalStack
        if: failure()
        run: |
          docker compose --env-file .env.example --profile app ps -a
          docker compose --env-file .env.example --profile app logs --no-color localstack
          container="$(docker compose --env-file .env.example --profile app ps -aq localstack)"
          if [ -n "$container" ]; then
            docker inspect --format 'status={{ .State.Status }} exit={{ .State.ExitCode }} health={{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$container"
            docker inspect --format '{{ json .State.Health }}' "$container"
          fi
      - name: Remove Compose resources
        if: always()
        run: docker compose --env-file .env.example --profile app down -v --remove-orphans
